<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>KapuTrain</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <header class="app-header">
      <div>
        <h1>Meus Treinos</h1>
        <p class="header-sub" id="hoje-text">Hoje</p>
      </div>
    </header>
    <main class="app-main" id="home-list">
      <button class="btn-primary" id="btn-novo-treino">+ Novo treino</button>
    </main>
  </div>

  <!-- WORKOUT -->
  <div id="screen-workout" class="screen">
    <header class="app-header workout-header">
      <button class="btn-icon" id="btn-voltar" aria-label="Voltar">←</button>
      <div class="workout-title-wrap">
        <h1 id="workout-title">—</h1>
        <p class="header-sub" id="workout-progress">—</p>
      </div>
      <button class="btn-icon" id="btn-editar" aria-label="Editar">✏️</button>
    </header>
    <main class="workout-main">
      <div class="carousel" id="carousel"></div>
      <div class="dots" id="dots"></div>
    </main>
    <footer class="workout-footer">
      <button class="btn-primary" id="btn-finalizar">Finalizar treino</button>
    </footer>
  </div>

  <!-- HISTORY -->
  <div id="screen-history" class="screen">
    <header class="app-header">
      <div>
        <h1>Histórico</h1>
        <p class="header-sub" id="history-sub">—</p>
      </div>
    </header>
    <main class="app-main" id="history-list"></main>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn active" data-screen="home">
      <span class="nav-icon">🏋️</span><span>Treinos</span>
    </button>
    <button class="nav-btn" data-screen="history">
      <span class="nav-icon">📊</span><span>Histórico</span>
    </button>
  </nav>

  <!-- MODAL: criar/editar treino -->
  <div class="modal-overlay" id="modal-edit">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-edit-title">Novo treino</h2>
        <button class="btn-icon" id="modal-edit-close">✕</button>
      </div>
      <div class="modal-body" id="modal-edit-body"></div>
      <div class="modal-footer">
        <button class="btn-ghost" id="btn-add-ex-lib">+ Adicionar exercício</button>
        <button class="btn-primary btn-sm" id="btn-save-edit">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: biblioteca de exercícios (picker) -->
  <div class="modal-overlay" id="modal-picker">
    <div class="modal modal-full">
      <div class="modal-header">
        <h2>Biblioteca</h2>
        <button class="btn-icon" id="modal-picker-close">✕</button>
      </div>
      <div class="picker-toolbar">
        <input type="search" id="picker-search" placeholder="Buscar exercício...">
        <div class="picker-tabs" id="picker-tabs"></div>
      </div>
      <div class="modal-body picker-body" id="picker-list"></div>
      <div class="modal-footer">
        <span class="picker-count" id="picker-count">0 selecionado(s)</span>
        <button class="btn-primary btn-sm" id="btn-picker-confirm">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: detalhe do histórico -->
  <div class="modal-overlay" id="modal-history">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-history-title">Detalhes</h2>
        <button class="btn-icon" id="modal-history-close">✕</button>
      </div>
      <div class="modal-body" id="modal-history-body"></div>
    </div>
  </div>

  <!-- MODAL: info exercício -->
  <div class="modal-overlay" id="modal-info">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-info-title">Exercício</h2>
        <button class="btn-icon" id="modal-info-close">✕</button>
      </div>
      <div class="modal-body" id="modal-info-body"></div>
    </div>
  </div>

  <!-- TIMER OVERLAY (série + descanso) -->
  <div class="timer-overlay" id="timer-overlay" role="dialog" aria-modal="true">
    <button class="timer-cancel" id="timer-cancel" aria-label="Cancelar">✕</button>

    <div class="timer-stage" id="timer-stage-prep">
      <p class="timer-kicker">PREPARE-SE</p>
      <div class="timer-big" id="timer-prep-num">10</div>
      <p class="timer-hint">Série em execução</p>
    </div>

    <div class="timer-stage" id="timer-stage-options" style="display:none">
      <p class="timer-kicker">DESCANSO</p>
      <h2 class="timer-title">Quanto tempo?</h2>
      <div class="timer-option-grid">
        <button class="timer-option" data-sec="60">1 minuto</button>
        <button class="timer-option" data-sec="90">1 minuto e 30s</button>
        <button class="timer-option" data-sec="120">2 minutos</button>
      </div>
      <button class="timer-link" id="timer-skip-options">Pular descanso</button>
    </div>

    <div class="timer-stage" id="timer-stage-rest" style="display:none">
      <p class="timer-kicker">DESCANSO</p>
      <div class="timer-big" id="timer-rest-num">1:00</div>
      <button class="timer-link" id="timer-skip-rest">Concluir agora</button>
    </div>
  </div>

  <footer class="app-footer">
    <span>Feito por Alysson · </span>
    <a href="mailto:alysonlpdl@outlook.com">alysonlpdl@outlook.com</a>
  </footer>

  <div id="error-box" style="display:none;position:fixed;top:0;left:0;right:0;background:#b91c1c;color:#fff;padding:10px;font-size:12px;z-index:9999;max-height:40vh;overflow:auto;white-space:pre-wrap;"></div>
  <script>
    window.addEventListener('error', e => {
      const box = document.getElementById('error-box');
      box.style.display = 'block';
      box.textContent += '⚠ ' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n\n';
    });
    window.addEventListener('unhandledrejection', e => {
      const box = document.getElementById('error-box');
      box.style.display = 'block';
      box.textContent += '⚠ Promise: ' + (e.reason?.message || e.reason) + '\n\n';
    });
  </script>

  <script src="exercises-data.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
